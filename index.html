<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Crawl Card Game</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--ease:cubic-bezier(.4,0,.2,1);--r:12px}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d0d0d;color:#f0f0f0;min-height:100vh;overflow-x:hidden}
  .screen{display:none;min-height:100vh;animation:fadeIn .35s var(--ease)}
  .screen.active{display:flex;flex-direction:column}
  @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  #home{background:#0d0d0d}
  .home-header{padding:48px 24px 20px;text-align:center}
  .home-header h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#fff 30%,#888);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .home-header p{color:#666;font-size:15px;margin-top:8px}
  .players-bar{display:flex;align-items:center;gap:8px;padding:0 24px 20px;flex-wrap:wrap}
  .player-chip{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:5px 14px;font-size:13px;color:#ccc;display:flex;align-items:center;gap:6px}
  .player-chip button{background:none;border:none;color:#555;cursor:pointer;font-size:14px;line-height:1;padding:0}
  .player-chip button:hover{color:#f05}
  .add-player{display:flex;gap:8px;padding:0 24px 28px;align-items:center}
  .add-player input{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 14px;color:#f0f0f0;font-size:14px;outline:none;max-width:220px}
  .add-player input:focus{border-color:#555}
  .add-player button{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:8px 16px;color:#ccc;font-size:13px;cursor:pointer;transition:all .2s}
  .add-player button:hover{background:#252525;border-color:#444}
  .themes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:0 24px 40px}
  .theme-card{border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;position:relative}
  .theme-card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .theme-card:active{transform:scale(.98)}
  .tc-inner{padding:20px 20px 16px;border:1px solid rgba(255,255,255,.06);border-radius:var(--r)}
  .tc-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
  .tc-emoji{font-size:30px;line-height:1;flex-shrink:0}
  .tc-info h3{font-size:17px;font-weight:700;margin-bottom:3px}
  .tc-info p{font-size:12px;opacity:.55;line-height:1.4}
  .tc-tags{display:flex;gap:6px;flex-wrap:wrap}
  .tc-tag{font-size:10px;font-weight:600;letter-spacing:.5px;padding:3px 9px;border-radius:20px;border:1px solid currentColor;opacity:.8;text-transform:uppercase}
  .tc-arrow{position:absolute;top:18px;right:18px;font-size:18px;opacity:.3;transition:opacity .2s}
  .theme-card:hover .tc-arrow{opacity:.8}
  #game{background:#0d0d0d}
  .game-header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid #1a1a1a;position:sticky;top:0;background:#0d0d0ddd;backdrop-filter:blur(12px);z-index:10}
  .gh-back{background:none;border:none;color:#888;cursor:pointer;font-size:22px;line-height:1;padding:4px 6px;border-radius:8px;transition:all .2s}
  .gh-back:hover{background:#1a1a1a;color:#fff}
  .gh-theme{flex:1;font-size:15px;font-weight:700}
  .gh-scores-btn{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:6px 14px;color:#ccc;font-size:13px;cursor:pointer;transition:all .2s}
  .gh-scores-btn:hover{background:#252525}
  .progress-bar{height:3px;background:#1a1a1a}
  .progress-fill{height:100%;transition:width .5s var(--ease)}
  .turn-banner{text-align:center;padding:14px 20px 10px;font-size:14px;color:#666}
  .turn-banner strong{font-weight:600}
  .card-area{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:16px 20px 32px}
  .card{width:100%;max-width:420px;border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:cardIn .4s var(--ease)}
  @keyframes cardIn{from{opacity:0;transform:scale(.93) translateY(16px)}to{opacity:1;transform:none}}
  .card-header{padding:22px 22px 18px}
  .card-type-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;opacity:.8}
  .card-title{font-size:26px;font-weight:800;color:#fff;line-height:1.2}
  .card-pts{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
  .card-body{background:#111;padding:22px}
  .card-text{font-size:16px;line-height:1.7;color:#d0d0d0;margin-bottom:18px}
  .card-tip{background:#1a1a1a;border-radius:10px;padding:12px 14px;font-size:13px;color:#888;line-height:1.5;margin-bottom:20px;border-left:3px solid #333}
  .card-tip b{color:#aaa}
  .card-actions{display:flex;gap:10px}
  .btn-complete{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .2s var(--ease)}
  .btn-complete:hover{filter:brightness(1.1);transform:translateY(-1px)}
  .btn-complete:active{transform:scale(.97)}
  .btn-skip{flex:.45;padding:13px;border-radius:10px;font-size:15px;font-weight:600;background:#1a1a1a;border:1px solid #2a2a2a;color:#666;cursor:pointer;transition:all .2s}
  .btn-skip:hover{background:#222;color:#999}
  .reveal-area{padding:22px;text-align:center}
  .btn-reveal{width:100%;padding:16px;border-radius:12px;font-size:16px;font-weight:700;border:none;cursor:pointer;transition:all .25s var(--ease);letter-spacing:.3px}
  .btn-reveal:hover{filter:brightness(1.15);transform:translateY(-2px)}
  .btn-reveal:active{transform:scale(.97)}
  .scores-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fadeOverlay .2s}
  @keyframes fadeOverlay{from{opacity:0}to{opacity:1}}
  .scores-panel{background:#141414;border-radius:20px 20px 0 0;padding:28px 24px 40px;width:100%;max-width:480px;border-top:1px solid #2a2a2a;animation:slideUp .3s var(--ease)}
  @keyframes slideUp{from{transform:translateY(40px)}to{transform:none}}
  .scores-panel h2{font-size:20px;font-weight:800;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
  .scores-panel h2 button{background:none;border:none;color:#555;cursor:pointer;font-size:22px}
  .score-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1a1a1a}
  .score-row:last-child{border-bottom:none}
  .score-rank{font-size:18px;width:28px;text-align:center}
  .score-name{flex:1;font-size:15px;font-weight:500}
  .score-pts{font-size:18px;font-weight:800;margin-left:auto}
  #end{background:#0d0d0d;align-items:center;justify-content:center;padding:32px 20px}
  .end-inner{max-width:420px;width:100%;text-align:center}
  .end-trophy{font-size:64px;margin-bottom:16px;animation:bounce .6s .2s both}
  @keyframes bounce{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
  .end-winner{font-size:28px;font-weight:800;margin-bottom:6px}
  .end-sub{color:#666;font-size:14px;margin-bottom:28px;line-height:1.6}
  .end-scores{background:#141414;border-radius:var(--r);overflow:hidden;margin-bottom:24px;border:1px solid #1e1e1e;width:100%}
  .end-row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #1a1a1a}
  .end-row:last-child{border-bottom:none}
  .end-row-rank{font-size:20px;width:30px;text-align:center}
  .end-row-name{flex:1;font-size:15px;font-weight:500}
  .end-row-pts{font-size:17px;font-weight:800}
  .btn-play-again{padding:14px 36px;border-radius:12px;font-size:16px;font-weight:700;background:linear-gradient(135deg,#fff,#ccc);color:#000;border:none;cursor:pointer;transition:all .2s}
  .btn-play-again:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,255,255,.15)}
</style>
</head>
<body>

<div id="home" class="screen active">
  <div class="home-header">
    <h1>🍻 Bar Crawl</h1>
    <p>Pick a theme · Gather your crew · Let the cards decide</p>
  </div>
  <div style="padding:0 24px 8px;font-size:12px;color:#555;letter-spacing:.5px;text-transform:uppercase">Players</div>
  <div class="players-bar" id="players-bar"></div>
  <div class="add-player">
    <input id="new-player-input" type="text" placeholder="Add player name…" maxlength="20">
    <button onclick="addPlayer()">+ Add</button>
  </div>
  <div style="padding:0 24px 14px;font-size:12px;color:#555;letter-spacing:.5px;text-transform:uppercase">Choose Theme</div>
  <div class="themes-grid" id="themes-grid"></div>
</div>

<div id="game" class="screen">
  <div class="game-header">
    <button class="gh-back" onclick="goHome()">←</button>
    <div class="gh-theme" id="gh-theme"></div>
    <button class="gh-scores-btn" onclick="toggleScores()">Scores 🏆</button>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="turn-banner" id="turn-banner"></div>
  <div class="card-area" id="card-area"></div>
</div>

<div id="end" class="screen">
  <div class="end-inner">
    <div class="end-trophy">🏆</div>
    <div class="end-winner" id="end-winner"></div>
    <div class="end-sub" id="end-sub"></div>
    <div class="end-scores" id="end-scores"></div>
    <button class="btn-play-again" onclick="goHome()">Play Again</button>
  </div>
</div>

<div id="scores-overlay" class="scores-overlay" style="display:none" onclick="closeScores(event)">
  <div class="scores-panel">
    <h2>Scoreboard <button onclick="closeScores()">×</button></h2>
    <div id="scores-list"></div>
  </div>
</div>

<script>

let players=["Player 1","Player 2","Player 3"];
let theme=null,deck=[],current=null,scores={},activePlayer=0;
let revealed=false,totalCards=0;

function renderPlayers(){
  const bar=document.getElementById('players-bar');
  bar.innerHTML=players.map((p,i)=>`
    <div class="player-chip">${p}${players.length>2?`<button onclick="removePlayer(${i})">×</button>`:''}</div>`).join('');
}

function addPlayer(){
  const inp=document.getElementById('new-player-input');
  const name=inp.value.trim();
  if(!name||players.length>=8)return;
  players.push(name);inp.value='';renderPlayers();
}

function removePlayer(i){
  if(players.length<=2)return;
  players.splice(i,1);renderPlayers();
}

function renderThemes(){
  const g=document.getElementById('themes-grid');
  g.innerHTML=Object.entries(THEMES).map(([key,t])=>`
    <div class="theme-card" onclick="startGame('${key}')" style="background:${t.bg}">
      <div class="tc-inner">
        <div class="tc-top">
          <div class="tc-emoji">${t.emoji}</div>
          <div class="tc-info">
            <h3 style="color:${t.acc}">${t.name}</h3>
            <p>${t.tagline}</p>
          </div>
        </div>
        <div class="tc-tags">
          <span class="tc-tag" style="color:${t.photoA};border-color:${t.photoA}">${t.PL}</span>
          <span class="tc-tag" style="color:${t.dareA};border-color:${t.dareA}">${t.DL}</span>
          <span class="tc-tag" style="color:${t.drinkA};border-color:${t.drinkA}">${t.DRL}</span>
        </div>
      </div>
      <div class="tc-arrow">→</div>
    </div>`).join('');
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function startGame(themeKey){
  theme=themeKey;
  const cats=CHALLENGES[themeKey];
  const t=THEMES[themeKey];
  let cards=[];
  cats.photo.forEach(c=>cards.push({...c,type:'photo',pts:3}));
  cats.dare.forEach(c=>cards.push({...c,type:'dare',pts:2}));
  cats.drink.forEach(c=>cards.push({...c,type:'drink',pts:1}));
  shuffle(cards);
  deck=cards.slice(1);current=cards[0];
  totalCards=cards.length;
  scores={};players.forEach(p=>scores[p]=0);
  activePlayer=0;revealed=false;
  document.getElementById('gh-theme').innerHTML=`${t.emoji} <span style="color:${t.acc}">${t.name}</span>`;
  showScreen('game');renderCard();updateProgress();
}

function updateProgress(){
  const played=totalCards-deck.length-(current?1:0);
  const pct=Math.round(played/totalCards*100);
  const fill=document.getElementById('progress-fill');
  fill.style.width=pct+'%';
  fill.style.background=THEMES[theme].acc;
}

function renderCard(){
  const t=THEMES[theme];
  document.getElementById('turn-banner').innerHTML=
    `<strong style="color:${t.acc}">${players[activePlayer]}</strong>'s turn &nbsp;·&nbsp; ${deck.length} cards left`;
  if(!current){endGame();return;}
  const typeB=current.type==='photo'?t.photoB:current.type==='dare'?t.dareB:t.drinkB;
  const typeA=current.type==='photo'?t.photoA:current.type==='dare'?t.dareA:t.drinkA;
  const typeLabel=current.type==='photo'?t.PL:current.type==='dare'?t.DL:t.DRL;
  const bodyHTML=revealed?`
    <div class="card-body">
      <p class="card-text">${current.b}</p>
      ${current.tip?`<div class="card-tip"><b>Tip:</b> ${current.tip}</div>`:''}
      <div class="card-actions">
        <button class="btn-complete" style="background:${typeA};color:#000" onclick="complete(true)">✓ Done! +${current.pts} pts</button>
        <button class="btn-skip" onclick="complete(false)">Skip</button>
      </div>
    </div>`:`
    <div class="reveal-area">
      <button class="btn-reveal" style="background:${typeA};color:#000" onclick="revealCard()">Reveal Challenge</button>
    </div>`;
  document.getElementById('card-area').innerHTML=`
    <div class="card">
      <div class="card-header" style="background:${typeB}">
        <div class="card-type-label" style="color:${typeA}">${typeLabel}</div>
        <div class="card-title">${current.t}</div>
        <div class="card-pts">★ ${current.pts} point${current.pts>1?'s':''}</div>
      </div>
      ${bodyHTML}
    </div>`;
}

function revealCard(){revealed=true;renderCard();}

function complete(did){
  if(did)scores[players[activePlayer]]=(scores[players[activePlayer]]||0)+current.pts;
  activePlayer=(activePlayer+1)%players.length;
  if(deck.length===0){current=null;endGame();return;}
  current=deck.shift();revealed=false;
  renderCard();updateProgress();
}

function endGame(){
  showScreen('end');
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const t=THEMES[theme];
  document.getElementById('end-winner').innerHTML=`<span style="color:${t.acc}">${sorted[0][0]}</span> wins!`;
  document.getElementById('end-sub').innerHTML=`With <strong>${sorted[0][1]} points</strong>.<br><span style="color:#555">The loser buys the final round. That is the law.</span>`;
  const medals=['🥇','🥈','🥉'];
  document.getElementById('end-scores').innerHTML=sorted.map(([name,pts],i)=>`
    <div class="end-row">
      <div class="end-row-rank">${medals[i]||''}</div>
      <div class="end-row-name" style="color:${i===0?t.acc:'#ccc'}">${name}</div>
      <div class="end-row-pts" style="color:${i===0?t.acc:'#666'}">${pts} pts</div>
    </div>`).join('');
}

function toggleScores(){
  const ov=document.getElementById('scores-overlay');
  if(ov.style.display==='none'){renderScores();ov.style.display='flex';}
  else ov.style.display='none';
}
function closeScores(e){
  if(!e||e.target===document.getElementById('scores-overlay'))
    document.getElementById('scores-overlay').style.display='none';
}
function renderScores(){
  const t=THEMES[theme];
  const sorted=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const max=sorted[0]?.[1]||1;
  document.getElementById('scores-list').innerHTML=sorted.map(([name,pts],i)=>`
    <div class="score-row">
      <div class="score-rank">${['🥇','🥈','🥉'][i]||''}</div>
      <div style="flex:1">
        <div class="score-name" style="color:${i===0?t.acc:'#ccc'}">${name}</div>
        <div style="height:4px;background:#1a1a1a;border-radius:2px;margin-top:5px;width:180px">
          <div style="height:100%;width:${Math.round(pts/max*100)}%;background:${t.acc};border-radius:2px;transition:width .5s"></div>
        </div>
      </div>
      <div class="score-pts" style="color:${i===0?t.acc:'#888'}">${pts}</div>
    </div>`).join('');
}

function goHome(){
  document.getElementById('scores-overlay').style.display='none';
  showScreen('home');
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Init
renderPlayers();
renderThemes();
document.getElementById('new-player-input').addEventListener('keydown',e=>{if(e.key==='Enter')addPlayer();});
</script>
</body>
</html>
